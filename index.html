<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة إدارة Crynova</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
  body { background:#0f172a; color:#e2e8f0; min-height:100vh; padding:16px; }
  .container { max-width:1200px; margin:0 auto; }

  .header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; padding:16px 20px; background:#1e293b;
    border-radius:16px; flex-wrap:wrap; gap:10px;
  }
  .header h1 { color:#6c5ce7; font-size:22px; display:flex; align-items:center; gap:10px; }
  .header-actions { display:flex; gap:8px; }
  .header-actions button {
    padding:10px 18px; border-radius:10px; border:none;
    background:#334155; color:#e2e8f0; font-weight:600;
    cursor:pointer; font-family:inherit; font-size:13px;
    transition:0.2s;
  }
  .header-actions button:hover { background:#475569; }
  .header-actions button.active { background:#6c5ce7; color:white; }

  .stats {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px; margin-bottom:20px;
  }
  .stat {
    background:#1e293b; padding:16px; border-radius:14px; text-align:center;
  }
  .stat .num { font-size:28px; font-weight:900; color:#6c5ce7; }
  .stat .lbl { color:#94a3b8; font-size:13px; margin-top:4px; }

  #list { display:flex; flex-direction:column; gap:16px; }

  .card {
    background:#1e293b; border-radius:16px; padding:20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
  }

  .card-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px; padding-bottom:12px;
    border-bottom:1px solid #334155; flex-wrap:wrap; gap:8px;
  }
  .user-name { font-size:18px; font-weight:800; color:white; }
  .user-meta { color:#94a3b8; font-size:13px; margin-top:3px; }
  .badge { padding:5px 12px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge.pending { background:rgba(251,191,36,0.15); color:#fbbf24; }
  .badge.approved { background:rgba(34,197,94,0.15); color:#22c55e; }
  .badge.rejected { background:rgba(239,68,68,0.15); color:#ef4444; }
  .badge.bot { background:rgba(96,165,250,0.15); color:#60a5fa; }
  .badge.app { background:rgba(168,85,247,0.15); color:#a855f7; }

  .media-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px; margin:14px 0;
  }
  .media-item {
    background:#0f172a; border-radius:12px; overflow:hidden;
    position:relative; aspect-ratio:1;
  }
  .media-item img, .media-item video {
    width:100%; height:100%; object-fit:cover;
    cursor:pointer; display:block;
  }
  .media-item .label {
    position:absolute; top:8px; right:8px;
    background:rgba(0,0,0,0.75); padding:4px 10px;
    border-radius:20px; font-size:11px; font-weight:700;
  }

  .text-content {
    background:#0f172a; padding:12px 16px; border-radius:12px;
    margin:10px 0; color:#cbd5e1; font-size:14px;
    white-space:pre-wrap; word-break:break-word;
  }

  .actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .actions button {
    flex:1; min-width:120px; padding:11px;
    border-radius:10px; border:none; font-weight:700;
    font-size:14px; cursor:pointer; font-family:inherit;
    transition:0.2s;
  }
  .btn-approve { background:linear-gradient(135deg,#22c55e,#16a34a); color:white; }
  .btn-approve:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(34,197,94,0.4); }
  .btn-reject { background:linear-gradient(135deg,#ef4444,#dc2626); color:white; }
  .btn-reject:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(239,68,68,0.4); }
  .btn-delete { background:#334155; color:#94a3b8; flex:0 0 auto !important; min-width:50px !important; }
  .btn-delete:hover { background:#475569; color:white; }
  .actions button:disabled { opacity:0.5; cursor:not-allowed; }

  .empty { text-align:center; padding:60px 20px; color:#64748b; }
  .empty i { font-size:56px; margin-bottom:16px; color:#334155; }

  /* Modals */
  #imageModal {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95);
    z-index:9999; justify-content:center; align-items:center; padding:20px;
  }
  #imageModal.active { display:flex; }
  #imageModal img, #imageModal video { max-width:95%; max-height:95%; border-radius:12px; }

  #rejectModal {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85);
    z-index:9999; justify-content:center; align-items:center; padding:20px;
  }
  #rejectModal.active { display:flex; }
  #rejectModal .box {
    background:#1e293b; padding:24px; border-radius:16px;
    max-width:420px; width:100%;
  }
  #rejectModal h3 { margin-bottom:16px; color:#ef4444; }
  #rejectModal textarea {
    width:100%; padding:12px; border-radius:10px;
    border:2px solid #334155; background:#0f172a; color:white;
    font-family:inherit; font-size:14px; resize:vertical; min-height:100px;
  }
  #rejectModal textarea:focus { outline:none; border-color:#ef4444; }
  #rejectModal .row { display:flex; gap:10px; margin-top:16px; }
  #rejectModal .row button {
    flex:1; padding:12px; border-radius:10px; border:none;
    font-weight:700; cursor:pointer; font-family:inherit;
  }
  #rejectModal .cancel { background:#334155; color:white; }
  #rejectModal .confirm { background:#ef4444; color:white; }

  .loading { text-align:center; padding:60px; color:#64748b; }
  .loading i { font-size:42px; color:#6c5ce7; margin-bottom:12px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><i class="fas fa-shield-alt"></i> لوحة إدارة Crynova</h1>
    <div class="header-actions">
      <button id="tabKyc" class="active" onclick="switchTab('kyc')">
        <i class="fas fa-id-card"></i> طلبات KYC
      </button>
      <button id="tabBot" onclick="switchTab('bot')">
        <i class="fas fa-robot"></i> رسائل البوت
      </button>
      <button onclick="loadAll()">
        <i class="fas fa-sync"></i> تحديث
      </button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">إجمالي KYC</div></div>
    <div class="stat"><div class="num" id="statPending" style="color:#fbbf24;">0</div><div class="lbl">قيد المراجعة</div></div>
    <div class="stat"><div class="num" id="statApproved" style="color:#22c55e;">0</div><div class="lbl">موافق عليها</div></div>
    <div class="stat"><div class="num" id="statRejected" style="color:#ef4444;">0</div><div class="lbl">مرفوضة</div></div>
  </div>

  <div id="loading" class="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <div>جاري التحميل...</div>
  </div>

  <div id="list"></div>
</div>

<div id="imageModal" onclick="closeImageModal()">
  <img id="modalImg" style="display:none;" />
  <video id="modalVideo" style="display:none;" controls autoplay></video>
</div>

<div id="rejectModal">
  <div class="box">
    <h3><i class="fas fa-times-circle"></i> سبب الرفض</h3>
    <textarea id="rejectReason" placeholder="مثال: صورة البطاقة غير واضحة / الفيديو غير مطابق..."></textarea>
    <div class="row">
      <button class="cancel" onclick="closeRejectModal()">إلغاء</button>
      <button class="confirm" onclick="confirmReject()">تأكيد الرفض</button>
    </div>
  </div>
</div>

<script>
const API_BASE = (window.location.protocol === 'file:')
  ? 'https://crynova-verification.onrender.com'
  : '';

let currentTab = 'kyc';
let currentRejectUserId = null;
let kycData = [];
let botData = [];
let refreshInterval = null;

// ============================================================
// Tabs
// ============================================================
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabKyc').classList.toggle('active', tab === 'kyc');
  document.getElementById('tabBot').classList.toggle('active', tab === 'bot');
  render();
}

// ============================================================
// Load
// ============================================================
async function loadAll() {
  try {
    const [kycRes, botRes] = await Promise.all([
      fetch(API_BASE + '/admin/api/requests', { cache: 'no-store' }),
      fetch(API_BASE + '/admin/api/messages', { cache: 'no-store' })
    ]);

    if (kycRes.ok) kycData = await kycRes.json();
    if (botRes.ok) botData = await botRes.json();

    document.getElementById('loading').style.display = 'none';
    updateStats();
    render();
  } catch (e) {
    console.error('Load error:', e);
    document.getElementById('loading').innerHTML = `
      <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
      <div style="color:#ef4444;font-weight:700;margin:12px 0;">فشل الاتصال بالخادم</div>
      <div style="font-size:13px;color:#94a3b8;direction:ltr;text-align:left;">
        API: <code style="color:#fbbf24;">${API_BASE}</code><br>
        خطأ: <code style="color:#fbbf24;">${e.message}</code>
      </div>
      <button onclick="loadAll()" style="margin-top:16px;padding:10px 20px;border-radius:10px;
        border:none;background:#6c5ce7;color:white;font-weight:700;cursor:pointer;font-family:inherit;">
        <i class="fas fa-redo"></i> إعادة المحاولة
      </button>
    `;
  }
}

function updateStats() {
  document.getElementById('statTotal').textContent = kycData.length;
  document.getElementById('statPending').textContent = kycData.filter(r => r.status === 'pending').length;
  document.getElementById('statApproved').textContent = kycData.filter(r => r.status === 'approved').length;
  document.getElementById('statRejected').textContent = kycData.filter(r => r.status === 'rejected').length;
}

// ============================================================
// Render
// ============================================================
function render() {
  const container = document.getElementById('list');
  if (currentTab === 'kyc') renderKycList(container);
  else renderBotList(container);
}

function renderKycList(container) {
  if (!kycData.length) {
    container.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><div>لا توجد طلبات</div></div>';
    return;
  }

  container.innerHTML = kycData.map(r => {
    const submitted = r.submittedAt
      ? new Date(r.submittedAt._seconds ? r.submittedAt._seconds * 1000 : r.submittedAt).toLocaleString('ar-DZ')
      : '—';
    const badgeClass = r.status === 'approved' ? 'approved' : r.status === 'rejected' ? 'rejected' : 'pending';
    const badgeText = r.status === 'approved' ? '✅ موافق عليه' : r.status === 'rejected' ? '❌ مرفوض' : '⏳ قيد المراجعة';
    const isPending = r.status === 'pending';
    const sourceBadge = r.source === 'bot'
      ? '<span class="badge bot" style="margin-right:6px;">🤖 من البوت</span>'
      : '<span class="badge app" style="margin-right:6px;">📱 من التطبيق</span>';

    return `
      <div class="card">
        <div class="card-header">
          <div>
            <div class="user-name">${r.fullName || 'بدون اسم'}</div>
            <div class="user-meta">
              <i class="fas fa-calendar"></i> ${r.birthDate || '—'} • 
              <i class="fas fa-id-badge"></i> ${r.userId} 
              ${r.username ? ' • @' + r.username : ''}
            </div>
            <div class="user-meta" style="margin-top:4px;">
              <i class="fas fa-clock"></i> ${submitted}
            </div>
          </div>
          <div>
            ${sourceBadge}
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
        </div>

        ${(r.frontUrl || r.backUrl || r.videoUrl) ? `
          <div class="media-grid">
            ${r.frontUrl ? `
              <div class="media-item" onclick="showMedia('${API_BASE}${r.frontUrl}', 'image')">
                <span class="label">📸 أمامي</span>
                <img src="${API_BASE}${r.frontUrl}" loading="lazy" />
              </div>
            ` : ''}
            ${r.backUrl ? `
              <div class="media-item" onclick="showMedia('${API_BASE}${r.backUrl}', 'image')">
                <span class="label">📸 خلفي</span>
                <img src="${API_BASE}${r.backUrl}" loading="lazy" />
              </div>
            ` : ''}
            ${r.videoUrl ? `
              <div class="media-item" onclick="showMedia('${API_BASE}${r.videoUrl}', 'video')">
                <span class="label">🎥 فيديو</span>
                <video src="${API_BASE}${r.videoUrl}" preload="metadata"></video>
              </div>
            ` : ''}
          </div>
        ` : '<div style="color:#64748b;font-size:13px;margin:12px 0;text-align:center;">لا توجد مرفقات</div>'}

        <div class="actions">
          ${isPending ? `
            <button class="btn-approve" onclick="approve('${r.userId}', this)">
              <i class="fas fa-check"></i> موافقة
            </button>
            <button class="btn-reject" onclick="openRejectModal('${r.userId}')">
              <i class="fas fa-times"></i> رفض
            </button>
          ` : ''}
          <button class="btn-delete" onclick="deleteRequest('${r.userId}')" title="حذف">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function renderBotList(container) {
  if (!botData.length) {
    container.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><div>لا توجد رسائل</div><div style="font-size:13px;margin-top:8px;color:#475569;">عندما يرسل المستخدمون رسائل للبوت، ستظهر هنا</div></div>';
    return;
  }

  container.innerHTML = botData.map(m => {
    const date = m.date
      ? new Date(m.date._seconds ? m.date._seconds * 1000 : m.date).toLocaleString('ar-DZ')
      : '—';
    return `
      <div class="card">
        <div class="card-header">
          <div>
            <div class="user-name">${m.displayName || 'بدون اسم'}</div>
            <div class="user-meta">
              <i class="fas fa-id-badge"></i> ${m.userId}
              ${m.username ? ' • @' + m.username : ''}
            </div>
            <div class="user-meta" style="margin-top:4px;">
              <i class="fas fa-clock"></i> ${date}
            </div>
          </div>
          <span class="badge bot">🤖 Bot</span>
        </div>

        ${m.text ? `<div class="text-content">${escapeHtml(m.text)}</div>` : ''}

        ${m.mediaUrl ? `
          <div class="media-grid">
            <div class="media-item" onclick="showMedia('${API_BASE}${m.mediaUrl}', '${m.mediaUrl.endsWith('.mp4') ? 'video' : 'image'}')">
              <span class="label">${m.mediaUrl.endsWith('.mp4') ? '🎥 فيديو' : '📸 صورة'}</span>
              ${m.mediaUrl.endsWith('.mp4')
                ? `<video src="${API_BASE}${m.mediaUrl}" preload="metadata"></video>`
                : `<img src="${API_BASE}${m.mediaUrl}" loading="lazy" />`}
            </div>
          </div>
        ` : ''}

        <div class="actions">
          <button class="btn-approve" onclick="approve('${m.userId}', this)" style="flex:1;">
            <i class="fas fa-check"></i> موافقة على KYC
          </button>
          <button class="btn-reject" onclick="openRejectModal('${m.userId}')" style="flex:1;">
            <i class="fas fa-times"></i> رفض
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(t) {
  return String(t).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ============================================================
// Approve / Reject / Delete
// ============================================================
async function approve(userId, btn) {
  if (!confirm(`تأكيد الموافقة على ${userId}؟`)) return;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  try {
    const res = await fetch(API_BASE + `/admin/api/approve/${userId}`, { method: 'POST' });
    if (res.ok) {
      alert('✅ تمت الموافقة');
      loadAll();
    } else {
      alert('❌ فشل');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check"></i> موافقة';
    }
  } catch (e) {
    alert('❌ خطأ: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> موافقة';
  }
}

function openRejectModal(userId) {
  currentRejectUserId = userId;
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectModal').classList.add('active');
}

function closeRejectModal() {
  document.getElementById('rejectModal').classList.remove('active');
  currentRejectUserId = null;
}

async function confirmReject() {
  const reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { alert('⚠️ اكتب سبب الرفض'); return; }
  const btn = document.querySelector('#rejectModal .confirm');
  btn.disabled = true; btn.textContent = 'جاري...';
  try {
    const res = await fetch(API_BASE + `/admin/api/reject/${currentRejectUserId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason })
    });
    if (res.ok) {
      alert('✅ تم الرفض');
      closeRejectModal();
      loadAll();
    } else {
      alert('❌ فشل');
    }
  } catch (e) {
    alert('❌ خطأ: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'تأكيد الرفض';
  }
}

async function deleteRequest(userId) {
  if (!confirm(`حذف الطلب المعلّق لـ ${userId}؟`)) return;
  try {
    await fetch(API_BASE + `/admin/api/delete/${userId}`, { method: 'POST' });
    loadAll();
  } catch (e) {
    alert('❌ خطأ: ' + e.message);
  }
}

// ============================================================
// Media preview
// ============================================================
function showMedia(url, type) {
  const modal = document.getElementById('imageModal');
  const img = document.getElementById('modalImg');
  const video = document.getElementById('modalVideo');
  if (type === 'video') {
    video.src = url;
    video.style.display = 'block';
    img.style.display = 'none';
  } else {
    img.src = url;
    img.style.display = 'block';
    video.style.display = 'none';
    video.pause();
  }
  modal.classList.add('active');
}

function closeImageModal() {
  const modal = document.getElementById('imageModal');
  modal.classList.remove('active');
  const video = document.getElementById('modalVideo');
  video.pause();
  video.src = '';
}

// ============================================================
// Boot
// ============================================================
loadAll();
refreshInterval = setInterval(loadAll, 30000);
</script>
</body>
</html>
