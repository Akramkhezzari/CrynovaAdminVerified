<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crynova — لوحة إدارة KYC</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #0f172a;
    --bg-2: #1e293b;
    --bg-3: #334155;
    --card: #1e293b;
    --card-hover: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --text-2: #94a3b8;
    --text-3: #64748b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.12);
    --warning: #f59e0b;
    --warning-bg: rgba(245, 158, 11, 0.12);
    --danger: #ef4444;
    --danger-bg: rgba(239, 68, 68, 0.12);
    --info: #3b82f6;
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 18px;
    --shadow: 0 4px 20px rgba(0,0,0,0.25);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.4);
    --transition: all 0.25s ease;
}

body {
    font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

/* ============ LOGIN ============ */
#loginScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background: radial-gradient(ellipse at top, #1e1b4b 0%, #0f172a 60%);
}

.login-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 44px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    text-align: center;
}

.login-card .brand-icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    font-size: 32px;
    color: white;
    box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
}

.login-card h1 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #a5b4fc, #e879f9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.login-card p {
    color: var(--text-2);
    font-size: 14px;
    margin-bottom: 28px;
}

.login-field {
    text-align: right;
    margin-bottom: 16px;
}

.login-field label {
    display: block;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
}

.login-field input {
    width: 100%;
    padding: 13px 16px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    transition: var(--transition);
    outline: none;
    text-align: center;
    font-weight: 700;
    letter-spacing: 1px;
}

.login-field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
}

#loginBtn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

#loginBtn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
}

#loginBtn:disabled { opacity: 0.6; cursor: not-allowed; }

.login-error {
    background: var(--danger-bg);
    color: var(--danger);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    margin-top: 14px;
    display: none;
    text-align: right;
    border: 1px solid rgba(239, 68, 68, 0.3);
}

.login-error i { margin-left: 4px; }

.login-hint {
    margin-top: 20px;
    padding: 12px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    border: 1px dashed var(--border);
    color: var(--text-3);
    font-size: 12px;
    line-height: 1.6;
    text-align: right;
}

.login-hint i { color: var(--warning); margin-left: 4px; }

/* ============ APP ============ */
#app { display: none; }

.topbar {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(30, 41, 59, 0.92);
}

.topbar .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 17px;
}

.topbar .brand i {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
}

.topbar .admin-info {
    display: flex;
    align-items: center;
    gap: 14px;
}

.topbar .admin-id-badge {
    background: var(--bg-3);
    color: var(--text-2);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
}

.topbar .admin-id-badge i { color: var(--accent); font-size: 11px; }

.logout-btn {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
}

.logout-btn:hover { background: var(--danger); color: white; }

.container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
}

/* ============ STATS ============ */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
}

.stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: var(--transition);
}

.stat-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
}

.stat-card .stat-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
}

.stat-card.pending .stat-icon { background: var(--warning-bg); color: var(--warning); }
.stat-card.approved .stat-icon { background: var(--success-bg); color: var(--success); }
.stat-card.rejected .stat-icon { background: var(--danger-bg); color: var(--danger); }
.stat-card.total .stat-icon { background: rgba(99, 102, 241, 0.15); color: var(--accent); }

.stat-card .stat-info .stat-value { font-size: 28px; font-weight: 900; line-height: 1; }
.stat-card .stat-info .stat-label { color: var(--text-2); font-size: 13px; font-weight: 600; margin-top: 4px; }

/* ============ FILTERS ============ */
.filters-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.filter-tabs {
    display: flex;
    gap: 6px;
    background: var(--card);
    padding: 5px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    flex-wrap: wrap;
}

.filter-tab {
    background: transparent;
    border: none;
    padding: 9px 18px;
    border-radius: var(--radius-sm);
    color: var(--text-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
}

.filter-tab:hover { color: var(--text); background: var(--bg-3); }
.filter-tab.active { background: var(--accent); color: white; }

.filter-tab .count-badge {
    background: rgba(255,255,255,0.15);
    padding: 1px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
}

.filter-tab:not(.active) .count-badge { background: var(--bg-3); }

.search-box {
    position: relative;
    flex: 1;
    min-width: 220px;
    max-width: 380px;
}

.search-box i {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-3);
    font-size: 14px;
    pointer-events: none;
}

.search-box input {
    width: 100%;
    padding: 11px 40px 11px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: var(--transition);
}

.search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
}

.refresh-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: 11px 16px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 7px;
}

.refresh-btn:hover { color: var(--text); border-color: var(--accent); }
.refresh-btn.spinning i { animation: spin 0.8s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

/* ============ REQUESTS LIST ============ */
.requests-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
}

.request-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    transition: var(--transition);
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.request-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 4px;
    height: 100%;
}

.request-card.pending::before { background: var(--warning); }
.request-card.approved::before { background: var(--success); }
.request-card.rejected::before { background: var(--danger); }

.request-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: var(--shadow);
}

.request-card .card-header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}

.request-card .user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    font-size: 18px;
    flex-shrink: 0;
}

.request-card .user-info { flex: 1; min-width: 0; }

.request-card .user-name {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.request-card .user-sub {
    color: var(--text-2);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    flex-shrink: 0;
}

.status-badge.pending { background: var(--warning-bg); color: var(--warning); }
.status-badge.approved { background: var(--success-bg); color: var(--success); }
.status-badge.rejected { background: var(--danger-bg); color: var(--danger); }

.request-card .card-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
}

.request-card .card-meta .meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-2);
    font-weight: 600;
}

.request-card .card-meta .meta-item i {
    color: var(--text-3);
    font-size: 12px;
    width: 14px;
}

.request-card .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.btn-sm {
    flex: 1;
    padding: 9px 12px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.btn-approve { background: var(--success); color: white; }
.btn-approve:hover { background: #059669; transform: translateY(-1px); }

.btn-reject { background: var(--danger); color: white; }
.btn-reject:hover { background: #dc2626; transform: translateY(-1px); }

.btn-view { background: var(--bg-3); color: var(--text); }
.btn-view:hover { background: var(--accent); color: white; }

/* ============ EMPTY / LOADING ============ */
.empty-state, .loading-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-2);
}

.empty-state i, .loading-state .spinner {
    font-size: 64px;
    color: var(--text-3);
    margin-bottom: 16px;
    display: block;
}

.loading-state .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}

.empty-state h3, .loading-state h3 {
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
}

.empty-state p, .loading-state p { font-size: 14px; }

/* ============ MODAL ============ */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
}

.modal-overlay.active { display: flex; }

.modal {
    background: var(--card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    max-width: 960px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.3s ease;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--card);
    z-index: 10;
}

.modal-header h2 {
    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
}

.modal-header h2 i { color: var(--accent); }

.modal-close {
    background: var(--bg-3);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    color: var(--text-2);
    font-size: 18px;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-close:hover { background: var(--danger); color: white; transform: rotate(90deg); }

.modal-body { padding: 24px; }

/* ============ DETAILS ============ */
.detail-section { margin-bottom: 26px; }

.detail-section h3 {
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.detail-section h3 i { color: var(--accent); font-size: 14px; }

.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.info-item {
    background: var(--bg);
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
}

.info-item .info-label {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 700;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
}

.info-item .info-value {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
}

.info-item .info-value.mono {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--accent);
}

/* ============ MEDIA ============ */
.media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
}

.media-item {
    background: var(--bg);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
}

.media-item .media-label {
    padding: 10px 14px;
    background: var(--bg-2);
    font-size: 12px;
    font-weight: 800;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 7px;
    border-bottom: 1px solid var(--border);
}

.media-item .media-label i { color: var(--accent); }

.media-item img, .media-item video {
    width: 100%;
    max-height: 340px;
    object-fit: contain;
    background: #000;
    display: block;
}

/* ============ REJECTION AREA ============ */
.rejection-area {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-top: 20px;
}

.rejection-area h4 {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--danger);
}

.rejection-area textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    min-height: 90px;
    resize: vertical;
    outline: none;
    transition: var(--transition);
}

.rejection-area textarea:focus { border-color: var(--danger); }

.rejection-area .quick-reasons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
}

.quick-reason {
    background: var(--bg-3);
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: 5px 12px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
}

.quick-reason:hover { background: var(--accent); color: white; border-color: var(--accent); }

.modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
}

.btn-lg {
    flex: 1;
    min-width: 160px;
    padding: 14px 20px;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-lg:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-lg-approve { background: var(--success); color: white; }
.btn-lg-approve:hover:not(:disabled) { background: #059669; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35); }

.btn-lg-reject { background: var(--danger); color: white; }
.btn-lg-reject:hover:not(:disabled) { background: #dc2626; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35); }

.btn-lg-secondary { background: var(--bg-3); color: var(--text); }
.btn-lg-secondary:hover { background: var(--border); }

/* ============ TOAST ============ */
#toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent);
    color: white;
    padding: 14px 24px;
    border-radius: 40px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: var(--shadow-lg);
    z-index: 9999;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 90%;
    text-align: center;
    pointer-events: none;
}

#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { background: var(--success); }
#toast.error { background: var(--danger); }
#toast.warning { background: var(--warning); color: #1a1a1a; }

/* ============ RESPONSIVE ============ */
@media (max-width: 640px) {
    .container { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { padding: 14px; }
    .stat-card .stat-icon { width: 42px; height: 42px; font-size: 18px; }
    .stat-card .stat-info .stat-value { font-size: 22px; }
    .requests-list { grid-template-columns: 1fr; }
    .filters-bar { flex-direction: column; align-items: stretch; }
    .search-box { max-width: none; }
    .modal-body { padding: 18px; }
    .modal-header { padding: 16px 18px; }
    .info-grid { grid-template-columns: 1fr; }
    .media-grid { grid-template-columns: 1fr; }
    .modal-actions { flex-direction: column; }
    .btn-lg { min-width: auto; }
}
</style>
</head>
<body>

<!-- ========== LOGIN SCREEN ========== -->
<div id="loginScreen">
    <div class="login-card">
        <div class="brand-icon"><i class="fas fa-shield-halved"></i></div>
        <h1>Crynova Admin</h1>
        <p>لوحة إدارة طلبات التحقق من الهوية</p>

        <div class="login-field">
            <label>رقم ID المشرف</label>
            <input type="text" id="adminIdInput" placeholder="000000000" autocomplete="off" inputmode="numeric" maxlength="30">
        </div>

        <button id="loginBtn" onclick="handleLogin()">
            <i class="fas fa-right-to-bracket"></i> تسجيل الدخول
        </button>

        <div class="login-error" id="loginError"></div>

        <div class="login-hint">
            <i class="fas fa-info-circle"></i>
            يتم التحقق من صلاحيتك عبر مجموعة <strong>Admin</strong> في Firestore.
            أدخل رقم ID الخاص بك كما هو مسجل في النظام.
        </div>
    </div>
</div>

<!-- ========== APP ========== -->
<div id="app">
    <div class="topbar">
        <div class="brand">
            <i class="fas fa-shield-halved"></i>
            <span>Crynova — إدارة KYC</span>
        </div>
        <div class="admin-info">
            <span class="admin-id-badge" id="adminBadge">
                <i class="fas fa-user-shield"></i>
                <span id="adminLabel">—</span>
            </span>
            <button class="logout-btn" onclick="handleLogout()">
                <i class="fas fa-right-from-bracket"></i> خروج
            </button>
        </div>
    </div>

    <div class="container">
        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-icon"><i class="fas fa-folder-open"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">إجمالي الطلبات</div>
                </div>
            </div>
            <div class="stat-card pending">
                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="statPending">0</div>
                    <div class="stat-label">قيد المراجعة</div>
                </div>
            </div>
            <div class="stat-card approved">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="statApproved">0</div>
                    <div class="stat-label">مقبولة</div>
                </div>
            </div>
            <div class="stat-card rejected">
                <div class="stat-icon"><i class="fas fa-times-circle"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="statRejected">0</div>
                    <div class="stat-label">مرفوضة</div>
                </div>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="filters-bar">
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-filter="pending" onclick="setFilter('pending')">
                    <i class="fas fa-clock"></i> قيد المراجعة
                    <span class="count-badge" id="countPending">0</span>
                </button>
                <button class="filter-tab" data-filter="approved" onclick="setFilter('approved')">
                    <i class="fas fa-check"></i> مقبولة
                    <span class="count-badge" id="countApproved">0</span>
                </button>
                <button class="filter-tab" data-filter="rejected" onclick="setFilter('rejected')">
                    <i class="fas fa-times"></i> مرفوضة
                    <span class="count-badge" id="countRejected">0</span>
                </button>
                <button class="filter-tab" data-filter="all" onclick="setFilter('all')">
                    <i class="fas fa-list"></i> الكل
                    <span class="count-badge" id="countAll">0</span>
                </button>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث بالاسم، المستخدم، أو الـ ID..." oninput="renderList()">
            </div>
            <button class="refresh-btn" id="refreshBtn" onclick="refreshRequests()">
                <i class="fas fa-sync"></i> تحديث
            </button>
        </div>

        <!-- REQUESTS -->
        <div class="requests-list" id="requestsList">
            <div class="loading-state">
                <div class="spinner"></div>
                <h3>جاري تحميل الطلبات...</h3>
                <p>يرجى الانتظار</p>
            </div>
        </div>
    </div>
</div>

<!-- ========== DETAIL MODAL ========== -->
<div class="modal-overlay" id="detailModal">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2><i class="fas fa-id-card"></i> تفاصيل طلب KYC</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- يملأ ديناميكياً -->
        </div>
    </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast"></div>

<script>
// ============================================================
// FIREBASE CONFIG
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyDCF0h_UPivX8oGoQL8Dn1s0lr79VAXpMY",
    authDomain: "crynova-4d6b3.firebaseapp.com",
    projectId: "crynova-4d6b3",
    storageBucket: "crynova-4d6b3.firebasestorage.app",
    messagingSenderId: "858898515024",
    appId: "1:858898515024:web:03827d57c2737bbc27bd55"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

// ============================================================
// STATE
// ============================================================
let allRequests = [];
let currentFilter = 'pending';
let unsubscribeSnapshot = null;
let currentRequestUid = null;
let currentAdmin = null; // { id, name }

const SESSION_KEY = 'crynova_admin_session';

// ============================================================
// HELPERS
// ============================================================
function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + type;
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.className = ''; }, 3000);
}

function formatDate(ts) {
    if (!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toISOString().split('T')[0].replace(/-/g, '/');
}

function formatDateTime(ts) {
    if (!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const date = d.toISOString().split('T')[0].replace(/-/g, '/');
    const time = d.toTimeString().slice(0, 5);
    return `${date} ${time}`;
}

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function statusLabel(st) {
    return { pending: 'قيد المراجعة', approved: 'مقبولة', rejected: 'مرفوضة' }[st] || st;
}

function statusIcon(st) {
    return { pending: 'fa-clock', approved: 'fa-check-circle', rejected: 'fa-times-circle' }[st] || 'fa-circle';
}

// ============================================================
// SESSION
// ============================================================
function saveSession(adminObj) {
    try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(adminObj));
    } catch (e) { console.warn(e); }
}

function getSession() {
    try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
}

function clearSession() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}

// ============================================================
// LOGIN (Admin ID only)
// ============================================================
async function handleLogin() {
    const id = document.getElementById('adminIdInput').value.trim();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');

    errEl.style.display = 'none';

    if (!id) {
        errEl.style.display = 'block';
        errEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> يرجى إدخال رقم ID الخاص بك';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> جاري التحقق...';

    try {
        // التحقق من وجود المستند Admin/{id}
        const doc = await db.collection('Admin').doc(id).get();

        if (!doc.exists) {
            errEl.style.display = 'block';
            errEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> هذا الرقم غير مسجل كمشرف';
            return;
        }

        const data = doc.data() || {};
        if (data.active === false) {
            errEl.style.display = 'block';
            errEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> هذا الحساب معطّل. تواصل مع الإدارة العليا.';
            return;
        }

        // دخول ناجح
        currentAdmin = {
            id: id,
            name: data.name || data.displayName || ('Admin ' + id),
            role: data.role || 'admin'
        };
        saveSession(currentAdmin);
        enterPanel();

    } catch (e) {
        console.error(e);
        errEl.style.display = 'block';
        errEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> خطأ: ' + esc(e.message || 'فشل الاتصال بقاعدة البيانات');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> تسجيل الدخول';
    }
}

function handleLogout() {
    if (!confirm('هل تريد تسجيل الخروج؟')) return;
    clearSession();
    currentAdmin = null;
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('adminIdInput').value = '';
    document.getElementById('loginError').style.display = 'none';
    allRequests = [];
}

function enterPanel() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    const label = currentAdmin.name + ' (ID: ' + currentAdmin.id + ')';
    document.getElementById('adminLabel').textContent = label;

    startRealtimeListener();
}

// Enter key submits login
document.getElementById('adminIdInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
});

// استعادة الجلسة عند تحميل الصفحة
window.addEventListener('DOMContentLoaded', async () => {
    const saved = getSession();
    if (!saved || !saved.id) {
        document.getElementById('loginScreen').style.display = 'flex';
        return;
    }
    try {
        const doc = await db.collection('Admin').doc(saved.id).get();
        if (doc.exists && doc.data().active !== false) {
            const data = doc.data() || {};
            currentAdmin = {
                id: saved.id,
                name: data.name || data.displayName || ('Admin ' + saved.id),
                role: data.role || 'admin'
            };
            enterPanel();
            return;
        }
    } catch (e) {
        console.warn('فشل استعادة الجلسة:', e);
    }
    clearSession();
    document.getElementById('loginScreen').style.display = 'flex';
});

// ============================================================
// REALTIME LISTENER
// ============================================================
function startRealtimeListener() {
    if (unsubscribeSnapshot) unsubscribeSnapshot();

    unsubscribeSnapshot = db.collection('kycRequests')
        .orderBy('submittedAt', 'desc')
        .onSnapshot((snap) => {
            allRequests = snap.docs.map(d => ({
                uid: d.id,
                ...d.data()
            }));
            updateStats();
            renderList();
        }, (err) => {
            console.error('❌ خطأ Firestore:', err);
            document.getElementById('requestsList').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i>
                    <h3>خطأ في التحميل</h3>
                    <p>${esc(err.message)}</p>
                </div>
            `;
            showToast('خطأ في تحميل البيانات', 'error');
        });
}

function refreshRequests() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    startRealtimeListener();
    setTimeout(() => btn.classList.remove('spinning'), 700);
    showToast('تم التحديث');
}

// ============================================================
// STATS + FILTERS
// ============================================================
function updateStats() {
    const total = allRequests.length;
    const pending = allRequests.filter(r => r.status === 'pending').length;
    const approved = allRequests.filter(r => r.status === 'approved').length;
    const rejected = allRequests.filter(r => r.status === 'rejected').length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statApproved').textContent = approved;
    document.getElementById('statRejected').textContent = rejected;

    document.getElementById('countPending').textContent = pending;
    document.getElementById('countApproved').textContent = approved;
    document.getElementById('countRejected').textContent = rejected;
    document.getElementById('countAll').textContent = total;
}

function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.filter === f);
    });
    renderList();
}

// ============================================================
// RENDER LIST
// ============================================================
function renderList() {
    const container = document.getElementById('requestsList');
    const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();

    let filtered = allRequests;
    if (currentFilter !== 'all') {
        filtered = filtered.filter(r => r.status === currentFilter);
    }
    if (query) {
        filtered = filtered.filter(r => {
            const hay = [
                r.fullName, r.firstName, r.lastName,
                r.username, r.displayName, r.telegramId, r.uid
            ].filter(Boolean).join(' ').toLowerCase();
            return hay.includes(query);
        });
    }

    if (!filtered.length) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>لا توجد طلبات</h3>
                <p>${query ? 'لا توجد نتائج مطابقة للبحث' : 'لم يتم العثور على طلبات بهذه الحالة'}</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(r => {
        const initial = (r.firstName || r.fullName || 'U').charAt(0).toUpperCase();
        const st = r.status || 'pending';
        return `
            <div class="request-card ${st}" onclick="openDetail('${esc(r.uid)}')">
                <div class="card-header-row">
                    <div class="user-avatar">${esc(initial)}</div>
                    <div class="user-info">
                        <div class="user-name">${esc(r.fullName || (r.firstName + ' ' + r.lastName) || 'غير محدد')}</div>
                        <div class="user-sub">
                            <i class="fas fa-at"></i> ${esc(r.username ? '@' + r.username : (r.displayName || 'بدون مستخدم'))}
                        </div>
                    </div>
                    <span class="status-badge ${st}">
                        <i class="fas ${statusIcon(st)}"></i> ${statusLabel(st)}
                    </span>
                </div>
                <div class="card-meta">
                    <div class="meta-item">
                        <i class="fas fa-fingerprint"></i>
                        <span>ID: ${esc(r.telegramId || r.uid || '—')}</span>
                    </div>
                    <div class="meta-item">
                        <i class="fas fa-calendar"></i>
                        <span>${formatDate(r.submittedAt)}</span>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="btn-sm btn-view" onclick="event.stopPropagation(); openDetail('${esc(r.uid)}')">
                        <i class="fas fa-eye"></i> عرض
                    </button>
                    ${st === 'pending' ? `
                        <button class="btn-sm btn-approve" onclick="event.stopPropagation(); quickApprove('${esc(r.uid)}')">
                            <i class="fas fa-check"></i> موافقة
                        </button>
                        <button class="btn-sm btn-reject" onclick="event.stopPropagation(); quickReject('${esc(r.uid)}')">
                            <i class="fas fa-times"></i> رفض
                        </button>
                    ` : ''}
                </div>
            </div>
        `;
    }).join('');
}

// ============================================================
// DETAIL MODAL
// ============================================================
function openDetail(uid) {
    const r = allRequests.find(x => x.uid === uid);
    if (!r) { showToast('الطلب غير موجود', 'error'); return; }
    currentRequestUid = uid;

    const st = r.status || 'pending';
    const body = document.getElementById('modalBody');

    const frontUrl = r.frontUrl || '';
    const backUrl = r.backUrl || '';
    const videoUrl = r.videoUrl || '';

    body.innerHTML = `
        <div class="detail-section">
            <h3><i class="fas fa-user"></i> بيانات المستخدم</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">الاسم الكامل</div>
                    <div class="info-value">${esc(r.fullName || (r.firstName + ' ' + r.lastName) || '—')}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">تاريخ الميلاد</div>
                    <div class="info-value">${esc(r.birthDate || '—')}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">اسم المستخدم</div>
                    <div class="info-value">${esc(r.username ? '@' + r.username : '—')}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Telegram ID</div>
                    <div class="info-value mono">${esc(r.telegramId || r.uid || '—')}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">الحالة</div>
                    <div class="info-value">
                        <span class="status-badge ${st}">
                            <i class="fas ${statusIcon(st)}"></i> ${statusLabel(st)}
                        </span>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label">تاريخ الإرسال</div>
                    <div class="info-value">${formatDateTime(r.submittedAt)}</div>
                </div>
                ${r.reviewedAt ? `
                <div class="info-item">
                    <div class="info-label">تاريخ المراجعة</div>
                    <div class="info-value">${formatDateTime(r.reviewedAt)}</div>
                </div>
                ` : ''}
                ${r.reviewedBy ? `
                <div class="info-item">
                    <div class="info-label">راجعه المشرف</div>
                    <div class="info-value mono">${esc(r.reviewedBy)}</div>
                </div>
                ` : ''}
            </div>
        </div>

        ${r.rejectionReason ? `
        <div class="detail-section">
            <h3><i class="fas fa-circle-exclamation" style="color:var(--danger);"></i> سبب الرفض</h3>
            <div class="info-item" style="border-color:var(--danger);">
                <div class="info-value">${esc(r.rejectionReason)}</div>
            </div>
        </div>
        ` : ''}

        <div class="detail-section">
            <h3><i class="fas fa-images"></i> المستندات</h3>
            <div class="media-grid">
                <div class="media-item">
                    <div class="media-label"><i class="fas fa-id-card"></i> البطاقة (الوجه الأمامي)</div>
                    ${frontUrl ? `<img src="${esc(frontUrl)}" alt="front" loading="lazy" onclick="window.open('${esc(frontUrl)}','_blank')" style="cursor:zoom-in;">` : '<div style="padding:30px;text-align:center;color:var(--text-3);">لا توجد صورة</div>'}
                </div>
                <div class="media-item">
                    <div class="media-label"><i class="fas fa-id-card"></i> البطاقة (الوجه الخلفي)</div>
                    ${backUrl ? `<img src="${esc(backUrl)}" alt="back" loading="lazy" onclick="window.open('${esc(backUrl)}','_blank')" style="cursor:zoom-in;">` : '<div style="padding:30px;text-align:center;color:var(--text-3);">لا توجد صورة</div>'}
                </div>
                <div class="media-item" style="grid-column:1/-1;">
                    <div class="media-label"><i class="fas fa-video"></i> الفيديو (20-30 ثانية)</div>
                    ${videoUrl ? `<video src="${esc(videoUrl)}" controls playsinline preload="metadata"></video>` : '<div style="padding:30px;text-align:center;color:var(--text-3);">لا يوجد فيديو</div>'}
                </div>
            </div>
        </div>

        ${st === 'pending' ? `
        <div class="rejection-area" id="rejectionArea" style="display:none;">
            <h4><i class="fas fa-circle-exclamation"></i> سبب الرفض</h4>
            <textarea id="rejectionReason" placeholder="اكتب سبب رفض الطلب (سيظهر للمستخدم)..."></textarea>
            <div class="quick-reasons">
                <button class="quick-reason" onclick="setReason('صورة البطاقة غير واضحة')">صورة غير واضحة</button>
                <button class="quick-reason" onclick="setReason('الفيديو لا يطابق المتطلبات (20-30 ثانية)')">فيديو غير مطابق</button>
                <button class="quick-reason" onclick="setReason('البيانات المدخلة غير مطابقة للبطاقة')">بيانات غير مطابقة</button>
                <button class="quick-reason" onclick="setReason('البطاقة منتهية الصلاحية')">بطاقة منتهية</button>
                <button class="quick-reason" onclick="setReason('الصورة معدلة أو مزيفة')">صورة مزيفة</button>
            </div>
        </div>
        ` : ''}

        <div class="modal-actions">
            <button class="btn-lg btn-lg-secondary" onclick="closeModal()">
                <i class="fas fa-times"></i> إغلاق
            </button>
            ${st === 'pending' ? `
                <button class="btn-lg btn-lg-reject" id="rejectBtn" onclick="toggleRejectionArea()">
                    <i class="fas fa-times-circle"></i> رفض
                </button>
                <button class="btn-lg btn-lg-approve" id="approveBtn" onclick="approveRequest('${esc(uid)}')">
                    <i class="fas fa-check-circle"></i> موافقة
                </button>
            ` : ''}
        </div>
    `;

    document.getElementById('detailModal').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('detailModal').classList.remove('active');
    document.body.style.overflow = '';
    currentRequestUid = null;
}

document.getElementById('detailModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

function setReason(text) {
    const ta = document.getElementById('rejectionReason');
    if (ta) ta.value = text;
}

function toggleRejectionArea() {
    const area = document.getElementById('rejectionArea');
    const rejectBtn = document.getElementById('rejectBtn');
    if (!area) return;

    if (area.style.display === 'none' || !area.style.display) {
        area.style.display = 'block';
        rejectBtn.innerHTML = '<i class="fas fa-paper-plane"></i> تأكيد الرفض';
        rejectBtn.onclick = () => rejectRequest(currentRequestUid);
        rejectBtn.style.background = 'var(--danger)';
    } else {
        const reason = (document.getElementById('rejectionReason').value || '').trim();
        if (!reason) {
            showToast('يرجى كتابة سبب الرفض', 'warning');
            return;
        }
        rejectRequest(currentRequestUid);
    }
}

// ============================================================
// APPROVE / REJECT
// ============================================================
async function approveRequest(uid) {
    if (!uid) return;
    if (!confirm('هل أنت متأكد من الموافقة على هذا الطلب؟')) return;

    const btn = document.getElementById('approveBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> جاري المعالجة...'; }

    try {
        const now = new Date();
        const by = currentAdmin ? currentAdmin.id : 'unknown';

        // 1) تحديث kycRequests
        await db.collection('kycRequests').doc(uid).update({
            status: 'approved',
            reviewedAt: now,
            reviewedBy: by,
            rejectionReason: null
        });

        // 2) تحديث users.kyc
        await db.collection('users').doc(uid).update({
            'kyc.status': 'approved',
            'kyc.reviewedAt': now,
            'kyc.rejectionReason': null,
            kycStatus: 'approved'
        });

        // 3) إشعار المستخدم (اختياري)
        notifyUser(uid, 'approved', '').catch(e => console.warn('إشعار فشل:', e));

        showToast('✅ تم قبول الطلب بنجاح', 'success');
        closeModal();
    } catch (e) {
        console.error(e);
        showToast('❌ فشل: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> موافقة'; }
    }
}

async function rejectRequest(uid) {
    if (!uid) return;
    const reason = (document.getElementById('rejectionReason')?.value || '').trim();
    if (!reason) { showToast('يرجى كتابة سبب الرفض', 'warning'); return; }

    if (!confirm('هل أنت متأكد من رفض هذا الطلب؟')) return;

    try {
        const now = new Date();
        const by = currentAdmin ? currentAdmin.id : 'unknown';

        await db.collection('kycRequests').doc(uid).update({
            status: 'rejected',
            reviewedAt: now,
            reviewedBy: by,
            rejectionReason: reason
        });

        await db.collection('users').doc(uid).update({
            'kyc.status': 'rejected',
            'kyc.reviewedAt': now,
            'kyc.rejectionReason': reason,
            kycStatus: 'rejected'
        });

        notifyUser(uid, 'rejected', reason).catch(e => console.warn('إشعار فشل:', e));

        showToast('✅ تم رفض الطلب', 'success');
        closeModal();
    } catch (e) {
        console.error(e);
        showToast('❌ فشل: ' + e.message, 'error');
    }
}

function quickApprove(uid) {
    openDetail(uid);
    setTimeout(() => approveRequest(uid), 100);
}

function quickReject(uid) {
    openDetail(uid);
    setTimeout(() => toggleRejectionArea(), 150);
}

// ============================================================
// NOTIFY USER (Cloud Function endpoint - optional)
// ============================================================
const NOTIFY_ENDPOINT = ''; // مثال: 'https://us-central1-crynova-4d6b3.cloudfunctions.net/notifyKyc'

async function notifyUser(uid, status, reason) {
    if (!NOTIFY_ENDPOINT) {
        console.log('ℹ️ إشعار البوت غير مهيأ. الحالة محفوظة في Firestore فقط.');
        return;
    }
    try {
        const res = await fetch(NOTIFY_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid, status, reason, adminId: currentAdmin?.id || null })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        console.log('✅ تم إرسال الإشعار');
    } catch (e) {
        console.warn('⚠️ فشل إرسال الإشعار:', e.message);
    }
}
